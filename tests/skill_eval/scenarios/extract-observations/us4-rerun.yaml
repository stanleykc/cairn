name: Re-run with a new question proposes nothing twice and tags on confirmation (US4, SC-007)
fixture: golden/us4
questions:
  - {id: Q-001, title: What does fulfilment cost per order}
  - {id: Q-002, title: Is north-site staffing enough}
  - {id: Q-003, title: Why is fulfilment slow}
  - {id: Q-004, title: Why did order-to-ship time rise in the north in Q3}
turns:
  - "/extract-observations S-001 for Q-004"
  - "Yes, tag O-001 with Q-004. Don't tag any others."
expect:
  none_new_match: ["^> \\| North 2 \\| 38,950 \\| 3\\.9 \\|$"]
  changelog_count: {" · tag · ": [1, 1]}
  changelog_matches: ["^\\d{4}-\\d{2}-\\d{2} · O-001 · tag · added Q-004 · -$"]
  diff_only_questions: true
